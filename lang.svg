<svg width="380" height="100" viewBox="0 0 380 100" xmlns="http://www.w3.org/2000/svg">
  <style>
    .icon { animation: float 3s ease-in-out infinite; transform-origin: center; }
    .icon:nth-child(1) { animation-delay: 0.0s; }
    .icon:nth-child(2) { animation-delay: 0.2s; }
    .icon:nth-child(3) { animation-delay: 0.4s; }
    .icon:nth-child(4) { animation-delay: 0.6s; }
    .icon:nth-child(5) { animation-delay: 0.8s; }
    .icon:nth-child(6) { animation-delay: 1.0s; }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
  </style>
  <g class="icon"><image href="https://skillicons.dev/icons?i=cpp" x="10" y="20" height="50" width="50"/></g>
  <g class="icon"><image href="https://skillicons.dev/icons?i=python" x="70" y="20" height="50" width="50"/></g>
  <g class="icon"><image href="https://skillicons.dev/icons?i=java" x="130" y="20" height="50" width="50"/></g>
  <g class="icon"><image href="https://skillicons.dev/icons?i=c" x="190" y="20" height="50" width="50"/></g>
  <g class="icon"><image href="https://skillicons.dev/icons?i=dart" x="250" y="20" height="50" width="50"/></g>
  <g class="icon"><image href="https://skillicons.dev/icons?i=haskell" x="310" y="20" height="50" width="50"/></g>
</svg>
